# Compila los instaladores de escritorio en los servidores de GitHub (gratis en repos públicos
# y con minutos incluidos en privados). No hace falta tener un Mac para generar la versión de macOS.
# Se lanza a mano desde la pestaña "Actions" o al publicar una etiqueta tipo v1.1.1.
name: Escritorio

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            files: |
              desktop/release/*.exe
              desktop/release/*.blockmap
              desktop/release/latest.yml
          - os: macos-latest
            target: mac
            files: |
              desktop/release/*.dmg
              desktop/release/*.zip
              desktop/release/*.blockmap
              desktop/release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias de la app
        run: npm ci

      - name: Exportar la app (versión web)
        run: npm run desktop:export

      - name: Comprobar archivos de escritorio
        run: node tools/check-desktop-files.js

      - name: Clave pública de licencias
        run: node tools/fill-license-key.js

      - name: Instalar Electron
        run: npm ci --prefix desktop

      - name: Crear instalador
        run: npm run dist:${{ matrix.target }} --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Clipsy-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      # Copia de los instaladores en una release de este repositorio (para pasarlos a razor-releases).
      - name: Versión
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-v${{ steps.ver.outputs.v }}
          name: Compilación ${{ steps.ver.outputs.v }}
          prerelease: true
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
